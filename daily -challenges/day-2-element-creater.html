
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Dynamic Element Creator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8f5;
            color: #222;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #16834a;
            text-align: center;
        }

        .description {
            text-align: center;
            line-height: 1.6;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        #add-button {
            display: block;
            margin: 20px auto;
            background-color: #16834a;
            color: white;
        }

        #add-button:hover {
            background-color: #106638;
        }

        #paragraph-list {
            margin-top: 25px;
        }

        .created-paragraph {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #eef7f0;
            border-left: 4px solid #16834a;
            border-radius: 5px;
        }

        .delete-button {
            background-color: #d93025;
            color: white;
        }

        .delete-button:hover {
            background-color: #a91e16;
        }

        #empty-message {
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Dynamic Element Creator</h1>

        <p class="description">
            Click the button below to create a new numbered paragraph.
            You can also delete any paragraph you have created.
        </p>

        <button id="add-button" type="button">
            Add New Paragraph
        </button>

        <section id="paragraph-list" aria-live="polite">
            <p id="empty-message">No paragraphs have been created yet.</p>
        </section>
    </main>

    <script>
        // Select the required HTML elements
        const addButton = document.querySelector("#add-button");
        const paragraphList = document.querySelector("#paragraph-list");
        const emptyMessage = document.querySelector("#empty-message");

        // Keep track of paragraph numbers
        let paragraphNumber = 1;

        // Create a new paragraph when the button is clicked
        addButton.addEventListener("click", function () {

            // Create a paragraph container
            const paragraphContainer = document.createElement("div");
            paragraphContainer.classList.add("created-paragraph");

            // Create the paragraph element
            const paragraph = document.createElement("p");
            paragraph.textContent = `This is paragraph number ${paragraphNumber}.`;

            // Create a delete button
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.classList.add("delete-button");
            deleteButton.type = "button";
            deleteButton.setAttribute(
                "aria-label",
                `Delete paragraph ${paragraphNumber}`
            );

            // Delete this paragraph when its button is clicked
            deleteButton.addEventListener("click", function () {
                paragraphContainer.remove();

                // Show the empty message when no paragraphs remain
                const remainingParagraphs =
                    paragraphList.querySelectorAll(".created-paragraph");

                if (remainingParagraphs.length === 0) {
                    emptyMessage.hidden = false;
                }
            });

            // Put the paragraph and button inside the container
            paragraphContainer.append(paragraph, deleteButton);

            // Add the container to the page
            paragraphList.appendChild(paragraphContainer);

            // Hide the empty message
            emptyMessage.hidden = true;

            // Increase the number for the next paragraph
            paragraphNumber++;
        });
    </script>
</body>
</html>
