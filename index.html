
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive To-Do List application built by Elvis Maina for IYF Weekend Academy Season 12 Week 5.">
    <title>My To-Do List | Elvis Maina</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <header class="app-header">
            <h1>My To-Do List</h1>
            <p>Organize your tasks and stay productive.</p>
        </header>

        <!-- Add Task Form -->
        <form id="todo-form">
            <label for="todo-input" class="visually-hidden">
                Enter a new task
            </label>

            <input
                type="text"
                id="todo-input"
                placeholder="What needs to be done?"
                autocomplete="off"
                required
            >

            <button type="submit" id="add-button">
                Add Task
            </button>
        </form>

        <!-- Task Filters -->
        <nav class="filters" aria-label="Filter tasks">
            <button
                type="button"
                class="filter active"
                data-filter="all"
                aria-pressed="true"
            >
                All
            </button>

            <button
                type="button"
                class="filter"
                data-filter="active"
                aria-pressed="false"
            >
                Active
            </button>

            <button
                type="button"
                class="filter"
                data-filter="completed"
                aria-pressed="false"
            >
                Completed
            </button>
        </nav>

        <!-- Task List -->
        <section class="task-section" aria-label="Your tasks">

            <ul id="todo-list" aria-live="polite">
                <!-- Tasks will be dynamically added here using JavaScript -->
            </ul>

            <p id="empty-message">
                No tasks yet. Add your first task!
            </p>

        </section>

        <!-- Task Statistics -->
        <footer class="stats">

            <span id="items-left">
                0 items left
            </span>

            <button type="button" id="clear-completed">
                Clear Completed
            </button>

        </footer>

        <p class="app-credit">
            Developed by Elvis Maina | IYF Weekend Academy Season 12
        </p>

    </main>

    <script src="app.js" defer></script>

</body>
</html>
